<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Жеке кабинет - To-Do</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">To-Do Manager</a>
            <div class="d-flex">
                <a href="dashboard.html" class="btn btn-outline-light me-2">Тапсырмалар</a>
                <a href="login.html" class="btn btn-light text-primary">Шығу</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <!-- Жеке мәліметтер -->
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm p-4">
                    <h4 class="mb-3">Жеке профиль</h4>
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Пайдаланушы аты</label>
                            <input type="text" class="form-control" value="Студент">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Электронды пошта</label>
                            <input type="email" class="form-control" value="student@example.com">
                        </div>
                        <button type="submit" class="btn btn-primary">Өзгерістерді сақтау</button>
                    </form>
                </div>
            </div>

            <!-- Санаттарды басқару -->
            <div class="col-md-6">
                <div class="card shadow-sm p-4">
                    <h4 class="mb-3">Тапсырма санаттары</h4>
                    <form class="d-flex mb-3">
                        <input type="text" class="form-control me-2" placeholder="Жаңа санат атауы">
                        <button type="submit" class="btn btn-success text-nowrap">Қосу</button>
                    </form>
                    <ul class="list-group">
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            Жұмыс
                            <button class="btn btn-sm btn-outline-danger">Жою</button>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            Оқу
                            <button class="btn btn-sm btn-outline-danger">Жою</button>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            Жеке
                            <button class="btn btn-sm btn-outline-danger">Жою</button>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
